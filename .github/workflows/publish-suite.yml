# Publishes the EASY Suite WordPress plugin (site-plugins/easy-suite) as a
# GitHub prerelease carrying easy-suite-<version>.zip, which is what the
# plugin's GitHub self-updater (module-updater.php) watches for. "Run
# workflow" is the whole release process: it reads the version from the
# plugin header, so bump the version in the plugin first.
#
# Two properties this flow must keep:
#
# - The release is created with the workflow GITHUB_TOKEN. GitHub does not
#   fire other workflows for token-created releases, so Build APK (which
#   listens for release "published" events) never runs for a suite
#   publish. That is deliberate: a plugin release must not rebuild or
#   re-attach the Android app.
# - The release is marked a prerelease. The desktop app's Squirrel updater
#   and the EASY Manager phone updater both key off full (non-prerelease)
#   releases and their own asset names, so suite prereleases stay
#   invisible to both. Only the Suite updater reads them, matching the
#   easy-suite-<version>.zip asset name.
#
# The zip also carries the EASY Manager web version (mobile/www, copied to
# the plugin's app/ folder), so running this is how iPhones get a phone
# app change.
#
# Re-running is safe: if the suite-v<version> release already exists, its
# zip asset is replaced instead of the run failing.

name: Publish Suite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read the plugin version
        id: version
        run: |
          VERSION="$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' site-plugins/easy-suite/easy-suite.php | sed -E 's/^.*Version:[[:space:]]*//; s/[[:space:]]*$//')"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a version from site-plugins/easy-suite/easy-suite.php (got '$VERSION')."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "EASY Suite version: $VERSION"

      # Never publish a zip WordPress can't parse: one syntax error takes the
      # whole site down, and the Plugins screen would offer it as a normal
      # one-click update. The runner's PHP is 8.3, the same as the live site.
      - name: php -l every plugin file
        run: |
          php -v | head -1
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! out="$(php -l "$f" 2>&1)"; then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find site-plugins/easy-suite -name '*.php' -print0)
          echo "Checked $count PHP files."
          if [ "$count" -eq 0 ]; then
            echo "::error::No PHP files found in site-plugins/easy-suite."; exit 1
          fi
          exit $fail

      # The EASY Manager web version (used on iPhones) is the phone app's
      # own www folder, served from the plugin's app/ folder. Copying it
      # here keeps one copy of the app in the repo; a phone app change
      # reaches iPhones on the next Suite publish (Android still needs
      # Build APK). config.js carries the version the app shows.
      - name: Add the EASY Manager web version
        run: |
          rm -rf site-plugins/easy-suite/app
          cp -r mobile/www site-plugins/easy-suite/app
          for f in index.html manifest.webmanifest sw.js js/websignin.js js/config.js; do
            test -f "site-plugins/easy-suite/app/$f" || { echo "::error::app/$f is missing from the web version."; exit 1; }
          done
          if find site-plugins/easy-suite/app -name '*.php' | grep -q .; then
            echo "::error::The web version must not contain PHP files."; exit 1
          fi
          grep -o "APP_VERSION: '[0-9.]*'" site-plugins/easy-suite/app/js/config.js

      - name: Zip the plugin
        run: |
          cd site-plugins
          zip -r "$GITHUB_WORKSPACE/easy-suite-${{ steps.version.outputs.version }}.zip" easy-suite

      - name: Create or refresh the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="suite-v${VERSION}"
          ASSET="easy-suite-${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its zip asset."
            gh release delete-asset "$TAG" "$ASSET" --yes || true
            gh release upload "$TAG" "$ASSET"
            gh release edit "$TAG" --title "EASY Suite ${VERSION}" --prerelease
          else
            gh release create "$TAG" "$ASSET" \
              --title "EASY Suite ${VERSION}" \
              --prerelease \
              --notes "EASY Suite ${VERSION} plugin package. The installed plugin offers this update on the WordPress Plugins screen; the attached zip also installs by hand (Plugins, Add New, Upload, Replace current)."
          fi

      # Keep only the two newest suite releases: the current one, plus the
      # one before it as a quick rollback (its zip still installs by hand).
      # Older suite-v* prereleases and their tags are deleted. Desktop
      # releases (v*) are never touched.
      - name: Remove older suite releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^suite-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^suite-v//' | sort -V | sed 's/^/suite-v/' \
            | head -n -2 \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
