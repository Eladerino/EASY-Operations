# Syntax-checks every EASY Suite PHP file with `php -l` on pull requests and
# pushes that touch the plugin. One PHP parse error takes the whole site down
# (wp-admin, the REST routes both apps use, everything), so a broken file
# should fail here, before it can be published.
#
# The runner's PHP is 8.3, the same as the live site.

name: Check Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'site-plugins/**'
      - '.github/workflows/check-suite.yml'
  push:
    branches: [main]
    paths:
      - 'site-plugins/**'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: php -l every plugin file
        run: |
          php -v | head -1
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! out="$(php -l "$f" 2>&1)"; then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find site-plugins -name '*.php' -print0)
          echo "Checked $count PHP files."
          if [ "$count" -eq 0 ]; then
            echo "::error::No PHP files found under site-plugins."; exit 1
          fi
          exit $fail
